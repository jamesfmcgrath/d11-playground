$schema: 'https://www.drupal.org/schema/drupal/sdc/1.0/schema.json#'
name: button
description: 'A Bootstrap 5 button component with text, URL, and style options'
props:
  type: object
  properties:
    text:
      type: string
      title: Text
      description: 'The button text'
    url:
      type: string
      title: URL
      description: 'The button link URL'
      default: '#'
    style:
      type: string
      title: Style
      description: 'Bootstrap button style variant'
      enum:
        - primary
        - secondary
        - success
        - danger
        - warning
        - info
        - light
        - dark
        - link
        - outline-primary
        - outline-secondary
        - outline-success
        - outline-danger
        - outline-warning
        - outline-info
        - outline-light
        - outline-dark
      default: primary
    size:
      type: string
      title: Size
      description: 'Button size'
      enum:
        - sm
        - md
        - lg
      default: md
  required:
    - text
