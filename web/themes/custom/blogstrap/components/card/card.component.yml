$schema: 'https://www.drupal.org/schema/drupal/sdc/1.0/schema.json#'
name: card
description: 'A Bootstrap 5 card component with title, body, and optional image'
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: 'The card title'
    body:
      type: string
      title: Body
      description: 'The card body content'
    image:
      type: object
      title: Image
      description: 'Optional card image'
      properties:
        src:
          type: string
          title: Image Source
        alt:
          type: string
          title: Alt Text
          default: ''
    image_position:
      type: string
      title: Image Position
      description: 'Position of the image (top or bottom)'
      enum:
        - top
        - bottom
      default: top
  required:
    - title
    - body
